// ---- goal arbitration and planning ------------------------------------------------
function nearestBelief(w,p,pred){
  let best=null,bs=-1;const R=w.body.radius;

    if(b.ref&&!w.buildings[b.ref])continue;
    const s=cf/(60+LW.arcDist(p.n,b.n,R));if(s>bs){bs=s;best=b;}}
  return best;
}
function plan(w,p,type,sp,data){
  const home=w.buildings[p.home],st=w.settlements[p.settlement],R=w.body.radius;
  switch(type){
    case 'drink':{
      const b=nearestBelief(w,p,'water');
      if(!b)return {steps:[{a:'explore',mode:'downhill'}],note:'no water known'};
      if(b.ref){const wb=w.buildings[b.ref],c=B.findCap(wb,'drink',p.id);if(c)return {steps:[{a:'use',b:wb.id,c:c.id,cap:'drink'}]};}
      return {steps:[{a:'go',to:b.n.slice()},{a:'drink'}]};}
    case 'eat':{
      const table=home&&B.findCap(home,'eat',p.id);
      if(p.inv.food>=1||(home&&home.stock.food>=1&&table))return table&&LW.arcDist(home.n,p.n,R)<150?{steps:[{a:'use',b:home.id,c:table.id,cap:'eat'}]}:{steps:[{a:'eat'}]};
      if(st&&st.stock.food>=1)return {steps:[{a:'withdraw',s:st.id,n:2},table?{a:'use',b:home.id,c:table.id,cap:'eat'}:{a:'eat'}]};
      const b=nearestBelief(w,p,'food');
      if(b)return {steps:[{a:'go',to:b.n.slice()},{a:'forage',n:3},{a:'eat'}]};
      return {steps:[{a:'explore'}],note:'no food known'};}
    case 'sleep':{
      const bed=home&&!home.flooded&&B.findCap(home,'sleep',p.id);
      return bed?{steps:[{a:'use',b:home.id,c:bed.id,cap:'sleep'}]}:{steps:[{a:'sleep'}]};}
    case 'socialize':{
      let best=null,bd=260;for(const id in w.persons){const q=w.persons[id];if(q===p||!q.alive||q.posture==='lie')continue;const d=V.dist(q.n,p.n)*R;if(d<bd){bd=d;best=q;}}
      return best?{steps:[{a:'talk',id:best.id}]}:null;}
    case 'build':{
      const b=w.buildings[data];if(!b||b.progress>=1)return null;
      for(const k in b.need){const lack=b.need[k]-(b.mat[k]||0);if(lack<=0)continue;
        if(p.inv[k]>0)return {steps:[{a:'deposit',b:b.id}]};
        if(st&&st.stock[k]>=1){const q=Math.min(lack,Math.floor(st.stock[k]),6);st.stock[k]-=q;p.inv[k]+=q;return {steps:[{a:'deposit',b:b.id}]};}
        if(k==='wood'){const wb=nearestBelief(w,p,'wood');if(!wb)return {steps:[{a:'explore'}],note:'no trees'};
          return {steps:[{a:'go',to:wb.n.slice()},{a:'gather',res:'wood',n:Math.min(6,lack)},{a:'deposit',b:b.id}]};}
        return {steps:[{a:'gather',res:k,n:Math.min(6,lack)},{a:'deposit',b:b.id}]};}
      return {steps:[{a:'build',b:b.id}]};}
    case 'farm':return w.buildings[data]?{steps:[{a:'farm',b:data}]}:null;
    case 'gatherFood':{const b=nearestBelief(w,p,'food');if(!b)return {steps:[{a:'explore'}],note:'no food known'};
      return {steps:[{a:'go',to:b.n.slice()},{a:'forage',n:5},{a:'deposit',s:st.id}]};}
    case 'craft':{const wb=w.buildings[data],c=wb&&B.findCap(wb,'work',p.id);return c?{steps:[{a:'use',b:wb.id,c:c.id,cap:'work'}]}:null;}
    case 'found':{

      const b=nearestBelief(w,p,'water');if(!b)return null;
      return {steps:[{a:'go',to:LW.offsetDir(b.n,60,60,R)},{a:'found'}]};}
    case 'explore':return {steps:[{a:'explore'}]};
    case 'study':{const c=home&&B.findCap(home,'study',p.id);return c?{steps:[{a:'use',b:home.id,c:c.id,cap:'study'}]}:{steps:[{a:'study'}]};}
    case 'activity':return w.activities[data]?{steps:[{a:'activity',id:data}]}:null;

function selfGoals(w,p,sp){
  // self-generated long-term goals shaped by values, personality and circumstance
  if(p.goals.filter(g=>g.src==='self').length>=2||LW.rand(w)>0.25)return;
  const opts=[];
  if(p.values.craft>0.4)opts.push({type:'master',skill:LW.pick(w,['farming','building','cooking','foraging'])});
  if(p.traits.curiosity>0.5)opts.push({type:'explore'});
  if(p.values.knowledge>0.5)opts.push({type:'invent'});
  if(p.values.family>0.4&&!p.partner)opts.push({type:'partner'});
  if(!opts.length)return;
  const g=LW.pick(w,opts);if(p.goals.some(x=>x.type===g.type))return;
  g.id=LW.newId(w,'g');g.src='self';g.pri=10+10*LW.rand(w);g.t0=w.tick;g.n=0;p.goals.push(g);
  M.remember(w,p,'goal','I resolved to '+goalText(g),0.6);

function goalText(g){return g.type==='master'?'master '+g.skill:g.type==='explore'?'see what lies beyond':g.type==='invent'?'understand how things work':g.type==='partner'?'find someone to share my life with':g.type;}
M.goalText=goalText;
function checkGoals(w,p){
  for(const g of p.goals.slice()){
    let done=false;
    if(g.type==='master')done=p.skills[g.skill]>=0.6;else if(g.type==='explore')done=p.explored-(g.base||(g.base=p.explored))>=8;
    else if(g.type==='partner')done=!!p.partner;else if(g.type==='invent')done=p.skills.lore>=0.5;
    if(done){p.goals=p.goals.filter(x=>x!==g);const ev=LW.emit(w,'goal.achieved',{id:p.id,goal:g.type},[],{e:[p.id]});M.remember(w,p,'achievement','I achieved my wish to '+goalText(g),0.9,ev);pushHist(p,ev);
      p.traits.courage=clamp(p.traits.courage+0.03,0,1);}
    else if(w.tick-g.t0>LW.ticksPerYear(w)*3&&g.src==='self'){p.goals=p.goals.filter(x=>x!==g);M.remember(w,p,'goal','I let go of my wish to '+goalText(g),0.5);}
  }

M.think=function(w,p,sp){
  const N=p.needs,hour=LW.hourAt(w,p.n),night=hour<5.5||hour>21.5,adult=L.isMature(w,p,sp),st=w.settlements[p.settlement],T=p.traits,C=[];
  const add=(type,score,data)=>{if(score>0)C.push({type,score:score+LW.rand(w)*5-(p.fails[type]||0)*4,data});};
  const en=sp.diet==='energy';
  if(!en){if(N.thirst<55)add('drink',(62-N.thirst)*2.4);if(N.hunger<50)add('eat',(56-N.hunger)*2.0);}
  if(N.energy<25||(night&&N.energy<72))add('sleep',(night?40:0)+(62-N.energy)*1.5);
  if(N.social<45)add('socialize',(52-N.social)*(0.5+T.sociability));
  for(const s of p.schedule)if(hour>=s.h0&&hour<s.h1)add(s.what==='work'?'_work':s.what,60,s.data);
  let workBoost=C.some(c=>c.type==='_work')?35:0;

        else if(b.kind==='field')add('farm',22+22*T.diligence+workBoost+(st.stock.food<st.members.length*3?14:0),id);
        else if(b.kind==='workshop'&&st.stock.tools<st.members.length)add('craft',14+16*T.diligence+workBoost,id);}
      if(st.stock.food<st.members.length*4&&!en)add('gatherFood',24+16*T.diligence+workBoost);
    }else if((sp.caps||[]).indexOf('build')>=0)add('found',24+10*T.diligence);
    for(const g of p.goals){
      if(g.type==='explore')add('explore',g.pri+14);else if(g.type==='invent')add('study',g.pri+14);else if(g.type==='partner')add('socialize',g.pri+10);
      else if(g.type==='master'){if(g.skill==='foraging'&&st)add('gatherFood',g.pri+16);else add('study',g.pri+6);}
      else if(g.type==='activity')add('activity',g.pri+20,g.activity);
      else if(g.type==='socialize'||g.type==='explore'||g.type==='study')add(g.type,g.pri+20);

      return;}
  }

M.die=function(w,p,cause){

  const ev=LW.emit(w,'person.died',{id:p.id,name:p.name,cause},[p.lastFail&&p.lastFail.ev],{e:[p.id],n:p.n});pushHist(p,ev);

M.tickPerson=function(w,p){
  const sp=w.species[p.speciesId],N=p.needs,en=sp.diet==='energy',hour=LW.hourAt(w,p.n);
  const asleep=p.posture==='lie'?0.5:1;
  if(!en){N.hunger=Math.max(0,N.hunger-0.014*asleep);N.thirst=Math.max(0,N.thirst-0.02*asleep);}
  else if(hour>7&&hour<18)N.energy=Math.min(100,N.energy+0.05);          // artificial life recharges in starlight

  if(!en&&(N.hunger<=0||N.thirst<=0))p.health-=0.03;else if(N.energy<=0)p.health-=0.01;else if(p.health<100)p.health=Math.min(100,p.health+0.01);
  if(p.health<=0)return M.die(w,p,!en&&N.thirst<=0?'thirst':!en&&N.hunger<=0?'starvation':'exhaustion');
  if(w.rules.aging&&(w.tick-p.born)>sp.lifecycle.span*p.lf*LW.ticksPerYear(w))return M.die(w,p,'old age');
  p.mood+=(((N.hunger+N.thirst+N.energy+N.social)/4-50)/50-p.mood)*0.004;

// coarse update for people outside the interest region: consequential bookkeeping only, no invented detail
M.coarse=function(w,p,dt){

// ---- player commands on people ------------------------------------------------------
const ACTS={go:1,use:1,drink:1,forage:1,eat:1,gather:1,sleep:1,explore:1,wait:1,talk:1,build:1,farm:1,study:1,activity:1,deposit:1};

};
function own(w,p,actor){return !p.control.by||p.control.by===actor.id?null:'this character is controlled by another player';}

  const out={persons:0,dead:0,active:0,dormant:0,animals:Object.keys(w.organisms).length,cohort:0,promoted:0};
  for(const id in w.persons){const p=w.persons[id];if(p.alive){out.persons++;out[p.lod==='active'?'active':'dormant']++;}else out.dead++;}
  for(const id in w.cohorts){out.cohort+=w.cohorts[id].count;out.promoted+=w.cohorts[id].promoted;}
  return out;
};

function actText(w,a){
  switch(a.a){case 'go':return 'walking';case 'use':return a.cap+(w.buildings[a.b]?' ('+((B.comp(w.buildings[a.b],a.c)||{}).kind||'?')+')':'');case 'talk':return 'talking to '+((w.persons[a.id]||{}).name||'someone');

function useCap(p,cap){
  const w=App.world;let best=null,bd=1e9;
  for(const id in w.buildings){const b=w.buildings[id];if(b.progress<1)continue;const c=B.findCap(b,cap,p.id);if(!c)continue;const d=LW.arcDist(b.n,p.n,w.body.radius)+(id===p.home?0:40);if(d<bd){bd=d;best={b,c};}}
  if(!best||bd>3000){if(cap==='sleep')return enq(p,{a:'sleep'});if(cap!=='eat')App.toast('No '+cap+' object nearby','warn');return false;}
  return enq(p,{a:'use',b:best.b.id,c:best.c.id,cap});
}

    h('label',{class:'sl'},h('span',{class:'lb',text:'Colours'}),h('input',{type:'color',value:d.c1,onchange:e=>{d.c1=e.target.value;}}),h('input',{type:'color',value:d.c2,onchange:e=>{d.c2=e.target.value;}})),
    slider('Coldest tolerated',-80,40,1,d.t0,v=>{d.t0=v;},v=>v+' °C'),slider('Hottest tolerated',-20,90,1,d.t1,v=>{d.t1=v;},v=>v+' °C'),
    slider('Driest tolerated',0,1,0.05,d.m0,v=>{d.m0=v;}),slider('Wettest tolerated',0,1,0.05,d.m1,v=>{d.m1=v;}),
    btn('Create species',()=>{

      if(d.kind==='plant'){sp.plant={tree:d.form!=='grass',form:d.form};sp.lifecycle={repro:'seed'};}
      else{Object.assign(sp.body,{plan:d.plan,size:d.size,legs:d.legs,arms:d.arms,tail:d.tail,wings:d.plan==='avian'?2:0,head:d.head});sp.senses={sight:d.sight};sp.move={speed:d.speed,swim:d.swim,fly:d.fly||d.plan==='avian'};sp.diet=d.diet;
        sp.lifecycle={span:d.span,mature:Math.min(d.mature,d.span*0.8),repro:d.repro,gest:Math.max(3,Math.round(d.size*10)),litter:d.size<0.6?3:1};sp.voice={pitch:Math.round(900/Math.max(0.3,d.size)),rough:d.diet==='carn'?0.8:0.2};
        if(d.kind==='person'){sp.manip=1;sp.caps=['speak','tool','build','farm'];}}

      if(r.ok){const t=App.tool;if(d.kind==='plant'){t.plant=id;App.setTool('life','plants');}else if(d.kind==='person'){t.person=id;App.setTool('life','person');}else{t.creature=id;App.setTool('life','creature');}UI.closeModal();App.toast('Species “'+d.name+'” created. Tap the world to introduce it.');}
    },'primary')]);
  render();
};
// visual, declarative activity editor: a list of typed steps with links. No scripts are ever stored or run.
UI.activityEditor=function(){
  const w=App.world;let g={name:'Evening routine',start:'n1',nodes:[{id:'n1',type:'go',place:'home',next:'n2'},{id:'n2',type:'use',cap:'eat',next:'n3'},{id:'n3',type:'if',cond:{time:'night'},then:'n4',else:'n5'},{id:'n4',type:'use',cap:'sleep',next:'n5'},{id:'n5',type:'end'}]};
  const render=()=>{
    const ids=g.nodes.map(n=>[n.id,n.id]);
    UI.showModal('Activity editor',[
      h('p',{class:'note',text:'Build a routine from steps. Each step is validated against real capabilities; nothing here is executable code.'}),
      h('label',{class:'sl'},h('span',{class:'lb',text:'Name'}),h('input',{type:'text',value:g.name,maxlength:40,onchange:e=>{g.name=e.target.value;}})),
      g.nodes.map((n,i)=>h('div',{class:'node'},h('b',{text:n.id}),
        select('Step',[['go','Go to'],['use','Use object'],['wait','Wait'],['if','If…'],['say','Think/say'],['end','End']],n.type,v=>{const id=n.id;g.nodes[i]=v==='go'?{id,type:v,place:'home',next:id}:v==='use'?{id,type:v,cap:'sit',next:id}:v==='wait'?{id,type:v,ticks:40,next:id}:v==='if'?{id,type:v,cond:{time:'night'},then:id,else:id}:v==='say'?{id,type:v,text:'…',next:id}:{id,type:'end'};render();}),
        n.type==='go'?select('Place',[['home','Home'],['settlement','Settlement centre'],['water','Known water']],n.place,v=>{n.place=v;}):null,
        n.type==='use'?select('To',['sleep','sit','eat','cook','store','drink','work','study'].map(c=>[c,c]),n.cap,v=>{n.cap=v;}):null,
        n.type==='wait'?slider('Ticks',4,2000,4,n.ticks,v=>{n.ticks=v;}):null,
        n.type==='say'?h('input',{type:'text',value:n.text,maxlength:80,onchange:e=>{n.text=e.target.value;}}):null,
        n.type==='if'?[select('Condition',[['night','it is night'],['day','it is day'],['hungry','hunger below 40'],['tired','energy below 30'],['food','carrying food']],n.cond.time||(n.cond.need==='hunger'?'hungry':n.cond.need==='energy'?'tired':'food'),v=>{n.cond=v==='night'||v==='day'?{time:v}:v==='hungry'?{need:'hunger',op:'<',value:40}:v==='tired'?{need:'energy',op:'<',value:30}:{has:'food'};}),
          select('Then',ids,n.then,v=>{n.then=v;}),select('Else',ids,n.else,v=>{n.else=v;})]:null,
        n.type!=='if'&&n.type!=='end'?select('Next',ids,n.next,v=>{n.next=v;}):null,
        btn('✕',()=>{g.nodes.splice(i,1);render();},'ghost icon','Remove step'))),
      h('div',{class:'row'},btn('+ Step',()=>{let k=g.nodes.length+1;while(g.nodes.some(n=>n.id==='n'+k))k++;g.nodes.push({id:'n'+k,type:'end'});render();}),
        btn('Save activity',()=>{const r=App.do('activity.define',{activity:g});if(r.ok){App.toast('Activity saved. Assign it from a character’s Mind tab.');UI.closeModal();}},'primary')),
      Object.values(w.activities).length?h('div',{class:'chips'},Object.values(w.activities).map(a=>btn('Edit: '+a.name,()=>{g=LW.clone(a);render();},'chip'))):null]);
  };
  render();
};

// ---- hints, toast, labels --------------------------------------------------------------------------
UI.renderHint=function(){
  const w=App.world,box=el('hint');if(!w||!App.opts.hints){box.hidden=true;return;}
  const alive=Object.values(w.persons).some(p=>p.alive),plants=w.env.plants.length>0;
  const step=!w.terrainEdits.length?'1 · Shape the land: choose ⛰ Sculpt and drag on the planet. Zoom in for finer tools.':
    !plants?'2 · This world is sterile. Choose 🌱 Life ▸ Plants and paint vegetation where the climate suits it.':
    !alive?'3 · Zoom toward a river (blue lines) and use 🌱 Life ▸ People to introduce someone.':
    !Object.keys(w.buildings).length?'4 · Give them shelter: 🏠 Build ▸ Cottage, tap near your people.':
    w.mode!=='play'?'5 · Press ▶ Play. Life begins: people look for water, food, rest and each other.':
    'Select a person and press “Take control” to direct them, then Release to let their own life resume.';
  set('hint',[h('span',{text:step}),btn('✕',()=>{App.opts.hints=false;UI.renderHint();},'ghost icon','Hide hints')]);box.hidden=false;
};
let toastT=0;
UI.renderToast=function(){const t=App.lastToast,box=el('toast');if(!t)return;box.textContent=t.msg;box.className=t.kind;box.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{box.hidden=true;},t.kind?6500:3800);};
UI.renderNav=function(){
  set('nav',[btn('+',()=>App.zoom(0.6),'icon','Zoom in'),btn('−',()=>App.zoom(1/0.6),'icon','Zoom out'),btn('⟲',()=>App.rotate(-0.4,0),'icon','Rotate left'),btn('⟳',()=>App.rotate(0.4,0),'icon','Rotate right'),
    btn('⤒',()=>App.rotate(0,-0.2),'icon','Tilt toward top-down'),btn('⤓',()=>App.rotate(0,0.2),'icon','Tilt toward horizon'),btn('N',()=>{App.cam.heading=0;App.cam.autoTilt=true;App.cam.depth=0;UI.renderTools();},'icon','North up, automatic tilt, surface view')]);
};
UI.frameLabels=function(){
  const w=App.world,c=App.cam,box=el('labels');if(!w||App.phase!=='play'){box.replaceChildren();return;}
  const R=w.body.radius,want=[];
  for(const id in w.settlements){const s=w.settlements[id];if(!s.members.length&&!s.buildings.length)continue;const p=LW.gfx.project(c,P.surface(w,s.n,12));if(p&&V.dot(s.n,V.norm(c.pos))>0.2&&p.z<Math.max(4000,R*4))want.push([id,s.name,p]);}
  if(c.dist>260)for(const id in w.persons){const q=w.persons[id];if(!q.alive)continue;const p=LW.gfx.project(c,P.surface(w,q.n,2));if(p&&V.dot(q.n,V.norm(c.pos))>0.2&&p.z<c.dist*4)want.push([id,'•',p]);}
  while(box.children.length>want.length)box.lastChild.remove();
  while(box.children.length<want.length)box.append(h('span',{class:'lbl'}));
  want.forEach((x,i)=>{const e=box.children[i];if(e.textContent!==x[1])e.textContent=x[1];e.className=x[1]==='•'?'lbl dot':'lbl';e.style.transform='translate('+Math.round(x[2].x)+'px,'+Math.round(x[2].y)+'px)';});
};
UI.renderAll=function(){UI.renderTop();UI.renderTools();UI.renderNav();UI.renderHint();};
let lastScale='',lastMode='',lastSel='';
App.listeners.push(what=>{
  if(App.phase!=='play'||!App.world){if(what==='toast')UI.renderToast();return;}
  const w=App.world;
  if(what==='toast')return UI.renderToast();
  if(what==='tick'){
    const ck=el('clock');if(ck)ck.textContent=LW.clockText(w)+(App.speed?'':' · paused');
    el('scale').textContent=App.scale()+' · '+fmtM(Math.max(0,App.cam.alt))+(App.cam.depth>0?' · '+App.cam.depth+' m underground view':'')+(App.terrain.pending>0?' · refining…':'');
    const sc=App.scale();if(sc!==lastScale){lastScale=sc;App.autoBrush();UI.renderTools();}
    if(w.mode!==lastMode){lastMode=w.mode;UI.renderTop();}
    if(!el('insp').hidden||App.sel)UI.renderInspector();
    UI.renderHint();return;
  }
  if(what==='speed'||what==='world'||what==='world.setMode'||what==='undo'||what==='redo')UI.renderTop();
  if(what==='tool'||what==='world')UI.renderTools();
  if(what==='select'||what==='compmenu'||what==='stroke'||what.indexOf('.')>0)UI.renderInspector();
});
})();

// boot
;(function(){'use strict';
const LW=globalThis.LW,G=LW.gfx,App=LW.app,UI=LW.ui;
App.errors=[];
addEventListener('error',e=>{App.errors.push(String(e.message||e.error));});
addEventListener('unhandledrejection',e=>{App.errors.push('rejection: '+String(e.reason&&e.reason.message||e.reason));});
async function boot(){
  const cv=document.getElementById('cv');App.canvas=cv;
  let gl=null;try{gl=G.init(cv);}catch(e){App.errors.push('gl: '+e.message);}
  if(!gl){
    const s=document.getElementById('start');s.hidden=false;
    s.replaceChildren(UI.h('div',{class:'card'},UI.h('h1',{text:'Living World'}),UI.h('p',{text:'This game needs WebGL2, which this browser or device did not provide. Try a current version of Chrome, Firefox, Edge or Safari, and make sure hardware acceleration is enabled.'})));
    return;
  }
  const dbg=gl.getExtension('WEBGL_debug_renderer_info');App.glInfo=dbg?String(gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL)).slice(0,80):'';
  cv.addEventListener('webglcontextlost',e=>{e.preventDefault();App.glLost=true;App.toast('Graphics context lost; waiting for the device to restore it…','warn');});
  cv.addEventListener('webglcontextrestored',()=>{G.init(cv);G._unit=null;App.terrain.nodes.clear();App.scene.bm.clear();App.scene.vm.clear();App.scene.water=null;App.scene.waterKey='';App.glLost=false;App.toast('Graphics restored.');});
  App.cam=G.newCamera();App.terrain=new G.Terrain();App.scene=new G.Scene();
  App.bindInput(cv);
  await App.initStore();
  App.newDraft();
  await UI.start();
  requestAnimationFrame(App.frame);
  const flush=()=>{if(App.world)App.snapshot(false);};
  document.addEventListener('visibilitychange',()=>{if(document.hidden)flush();});
  addEventListener('pagehide',flush);
  App.booted=true;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
