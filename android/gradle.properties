org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# This project ships no analytics/telemetry; also disable the Android Gradle
# Plugin's own build-analytics ping so no network call happens even at
# build time on a developer's later CI runs without --offline.
android.experimental.enableNewResourceShrinker=true
